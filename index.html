<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Obsidian</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  main { text-align: center; padding: 16px; }
  a { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #7c3aed; color: #fff; border-radius: 6px; text-decoration: none; }
  p { color: #999; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div id="name">Opening in Obsidian...</div>
  <a id="go" href="#">Open in Obsidian</a>
  <p>You can close this tab once Obsidian opens.</p>
</main>
<script>
  // Note path comes after the # and never leaves this browser.
  // Example: .../obs/#99%20System%2FNudges  or  #TASKS
  var VAULT = "KG's Vault 28082026 - Obsidian Sync";
  var file = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  var target = 'obsidian://open?vault=' + encodeURIComponent(VAULT) + (file ? '&file=' + encodeURIComponent(file) : '');
  document.getElementById('go').href = target;
  document.getElementById('name').textContent = file ? 'Opening ' + file.split('/').pop() + ' in Obsidian...' : 'Opening the vault in Obsidian...';
  location.href = target;
</script>
</body>
</html>
